<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>分組工具</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#eef1f4;--surface:#fff;--ink:#1b2430;--muted:#5d6b7a;--line:#d5dce3;
  --accent:#0f6b63;--on-accent:#fff;
  --m:#1f5fa6;--m-bg:#e2edfa;--f:#b0306f;--f-bg:#fae4ef;
  --ok:#17784a;--ok-bg:#dff3e8;--bad:#a43a1e;--bad-bg:#fbe5de;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161c;--surface:#1a212a;--ink:#e8edf2;--muted:#9aa7b4;--line:#2d3844;
    --accent:#3cc4b4;--on-accent:#0b1a18;
    --m:#82b8f0;--m-bg:#1b2d44;--f:#f08cc1;--f-bg:#3d1f31;
    --ok:#6fd9a1;--ok-bg:#16352a;--bad:#f2a58c;--bad-bg:#3d2219;
  }
}
:root[data-theme="dark"]{
  --bg:#11161c;--surface:#1a212a;--ink:#e8edf2;--muted:#9aa7b4;--line:#2d3844;
  --accent:#3cc4b4;--on-accent:#0b1a18;
  --m:#82b8f0;--m-bg:#1b2d44;--f:#f08cc1;--f-bg:#3d1f31;
  --ok:#6fd9a1;--ok-bg:#16352a;--bad:#f2a58c;--bad-bg:#3d2219;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6;font-size:16px}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:.04em}
.sub{color:var(--muted);margin:0 0 20px}
h2{font-size:1.1rem;margin:0}
.layout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.layout{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
label.f{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.95rem}
input[type=number],input[type=text],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
input[type=number]{width:84px;text-align:center}
input:focus-visible,button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px}
button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700;padding:10px 22px}
.plist{max-height:460px;overflow:auto;border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.prow{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:4px 0}
.no{color:var(--muted);text-align:right;font-size:.85rem}
.seg{display:inline-flex}
.seg button{border-radius:0;padding:5px 12px;color:var(--muted)}
.seg button:first-child{border-radius:8px 0 0 8px}
.seg button:last-child{border-radius:0 8px 8px 0;border-left:0}
.seg button.on.m{background:var(--m-bg);color:var(--m);border-color:var(--m);font-weight:700}
.seg button.on.f{background:var(--f-bg);color:var(--f);border-color:var(--f);font-weight:700}
details{margin-top:10px}
summary{cursor:pointer;color:var(--muted)}
textarea{width:100%;min-height:90px;margin:8px 0}
.ghead,.grow{display:grid;grid-template-columns:60px repeat(3,minmax(0,1fr));gap:8px;align-items:center}
.ghead{color:var(--muted);font-size:.9rem;text-align:center;margin-bottom:4px}
.grow{padding:4px 0}
.grow b{font-weight:500}
.grow input{width:100%}
.ghead .m,.grow .mm{color:var(--m)}
.ghead .f,.grow .ff{color:var(--f)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{padding:3px 12px;border-radius:999px;font-size:.9rem;background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.err{color:var(--bad);background:var(--bad-bg);border-radius:8px;padding:8px 12px;margin-top:12px;display:none}
.err.show{display:block}
.results{margin-top:16px;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.gcard{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface)}
.gcard h3{margin:0 0 8px;font-size:1rem;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.gcard h3 small{color:var(--muted);font-weight:400}
.gcard ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.gcard li{padding:3px 10px;border-radius:6px;border-left:4px solid}
.gcard li.m{background:var(--m-bg);color:var(--m);border-color:var(--m)}
.gcard li.f{background:var(--f-bg);color:var(--f);border-color:var(--f)}
.empty{color:var(--muted);margin:16px 0 0}
.del{padding:4px 9px;color:var(--muted);line-height:1}
.del:hover{color:var(--bad);border-color:var(--bad)}
.range{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:.95rem;margin-top:8px}
.range input{width:64px}
.range .m{color:var(--m);border-color:var(--m)}
.range .f{color:var(--f);border-color:var(--f)}
.rules{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.rules h3{margin:0 0 4px;font-size:1rem}
.rule{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:4px 0;color:var(--muted)}
.rule input{width:72px}
.addrule{margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>分組工具</h1>
  <p class="sub">設定名單與性別，再決定每組人數與男女人數，按下按鈕就會隨機分組。</p>
  <div class="layout">
    <section class="card" aria-labelledby="h-people">
      <div class="head">
        <h2 id="h-people">名單</h2>
        <label class="f">總人數 <input type="number" id="nPeople" min="1" max="200" value="12" inputmode="numeric"></label>
      </div>
      <div id="pcount" class="sub" style="margin:0"></div>
      <div class="range">
        <span>批次設定：第</span><input type="number" id="rFrom" min="1" inputmode="numeric" aria-label="起始號碼">
        <span>號到第</span><input type="number" id="rTo" min="1" inputmode="numeric" aria-label="結束號碼"><span>號</span>
        <button type="button" class="m" id="rM">設為男生</button>
        <button type="button" class="f" id="rF">設為女生</button>
      </div>
      <div class="plist" id="people"></div>
      <details>
        <summary>一次貼上整份名單</summary>
        <textarea id="bulk" placeholder="每行一位，或用逗號分隔"></textarea>
        <button type="button" id="applyBulk">套用名單</button>
      </details>
    </section>

    <section class="card" aria-labelledby="h-groups">
      <div class="head">
        <h2 id="h-groups">分組設定</h2>
        <label class="f">組數 <input type="number" id="nGroups" min="1" max="30" value="3" inputmode="numeric"></label>
      </div>
      <div class="ghead"><span></span><span>人數</span><span class="m">男生</span><span class="f">女生</span></div>
      <div id="groups"></div>
      <div class="rules">
        <h3>不能同組的限制</h3>
        <div id="rules"></div>
        <button type="button" class="addrule" id="addRule">＋ 新增限制</button>
      </div>
      <div class="chips" id="chips" aria-live="polite"></div>
      <div class="actions">
        <button type="button" id="auto">自動平均分配</button>
        <button type="button" id="reset">重設全部</button>
        <button type="button" class="primary" id="go">開始分組</button>
      </div>
      <div class="err" id="err" role="alert"></div>
    </section>
  </div>

  <section class="card" style="margin-top:16px" aria-labelledby="h-res">
    <div class="head">
      <h2 id="h-res">分組結果</h2>
      <div class="actions" style="margin:0">
        <button type="button" id="again" hidden>重新抽籤</button>
        <button type="button" id="copy" hidden>複製結果</button>
      </div>
    </div>
    <p class="empty" id="empty">設定完成後按「開始分組」，結果會顯示在這裡。</p>
    <div class="results" id="results"></div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
let people = [], groups = [], rules = [], result = null, custom = false;

function clampInt(v, min, max){
  v = parseInt(v, 10);
  if (isNaN(v)) v = min;
  return Math.max(min, Math.min(max, v));
}
function defName(i){ return (i + 1) + '號'; }
function nameOf(i){ return (people[i].name || '').trim() || defName(i); }
function countG(g){ return people.filter(p => p.g === g).length; }

function setPeople(n){
  while (people.length < n){
    const i = people.length;
    people.push({name: defName(i), g: i % 2 ? 'f' : 'm'});
  }
  people.length = n;
}
function setGroups(n){
  while (groups.length < n) groups.push({size:0, m:0, f:0});
  groups.length = n;
}

function autoFill(){
  custom = false;
  const N = people.length, M = countG('m'), G = groups.length;
  let cum = 0;
  groups.forEach((g, i) => {
    const size = Math.floor(N / G) + (i < N % G ? 1 : 0);
    const a = Math.round(cum * M / N), b = Math.round((cum + size) * M / N);
    g.size = size; g.m = b - a; g.f = size - g.m;
    cum += size;
  });
}

function renderPeople(){
  const box = $('#people');
  box.textContent = '';
  people.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'prow';
    const no = document.createElement('span');
    no.className = 'no'; no.textContent = i + 1;
    const inp = document.createElement('input');
    inp.type = 'text'; inp.value = p.name; inp.dataset.i = i;
    inp.setAttribute('aria-label', '第' + (i + 1) + '位姓名');
    const seg = document.createElement('div');
    seg.className = 'seg'; seg.setAttribute('role', 'group');
    [['m','男'],['f','女']].forEach(([g, t]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = t;
      b.dataset.i = i; b.dataset.g = g;
      b.className = g + (p.g === g ? ' on' : '');
      b.setAttribute('aria-pressed', p.g === g);
      seg.append(b);
    });
    const del = document.createElement('button');
    del.type = 'button'; del.className = 'del'; del.textContent = '✕';
    del.dataset.del = i;
    del.setAttribute('aria-label', '刪除第' + (i + 1) + '位');
    row.append(no, inp, seg, del);
    box.append(row);
  });
  updatePCount();
}
function updatePCount(){
  $('#pcount').textContent = '男生 ' + countG('m') + ' 位，女生 ' + countG('f') + ' 位';
}

function renderGroups(){
  const box = $('#groups');
  box.textContent = '';
  groups.forEach((g, i) => {
    const row = document.createElement('div');
    row.className = 'grow';
    const lab = document.createElement('b');
    lab.textContent = '第' + (i + 1) + '組';
    row.append(lab);
    [['size','人數',''],['m','男生','mm'],['f','女生','ff']].forEach(([k, t, c]) => {
      const inp = document.createElement('input');
      inp.type = 'number'; inp.min = 0; inp.max = 999; inp.inputMode = 'numeric';
      inp.value = g[k]; inp.dataset.i = i; inp.dataset.k = k;
      inp.setAttribute('aria-label', '第' + (i + 1) + '組' + t);
      if (c) inp.className = c;
      row.append(inp);
    });
    box.append(row);
  });
  updateStatus();
}

function sums(){
  return {
    size: groups.reduce((a, g) => a + g.size, 0),
    m: groups.reduce((a, g) => a + g.m, 0),
    f: groups.reduce((a, g) => a + g.f, 0)
  };
}
function updateStatus(){
  const s = sums(), N = people.length, M = countG('m'), F = countG('f');
  const items = [['總人數', s.size, N], ['男生', s.m, M], ['女生', s.f, F]];
  const box = $('#chips');
  box.textContent = '';
  items.forEach(([t, a, b]) => {
    const c = document.createElement('span');
    c.className = 'chip' + (a === b ? '' : ' bad');
    c.textContent = t + '：已分配 ' + a + ' / 名單 ' + b;
    box.append(c);
  });
}

function shuffle(a){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generate(){
  const err = $('#err');
  const s = sums(), N = people.length, M = countG('m'), F = countG('f');
  const msgs = [];
  if (s.size !== N) msgs.push('各組人數合計 ' + s.size + ' 人，但名單有 ' + N + ' 人。');
  if (s.m !== M) msgs.push('各組男生合計 ' + s.m + ' 人，但名單有 ' + M + ' 位男生。');
  if (s.f !== F) msgs.push('各組女生合計 ' + s.f + ' 人，但名單有 ' + F + ' 位女生。');
  const cons = [];
  for (const r of rules){
    if (r.a == null && r.b == null) continue;
    if (r.a == null || r.b == null || r.a === r.b || r.a > N || r.b > N){
      msgs.push('不能同組的限制有誤：兩個號碼都要填寫、不能相同，且要在 1 到 ' + N + ' 之間。');
      break;
    }
    cons.push([r.a - 1, r.b - 1]);
  }
  if (msgs.length){
    err.textContent = msgs.join(' ') + ' 請調整各組人數，或按「自動平均分配」。';
    err.classList.add('show');
    return;
  }
  err.classList.remove('show');
  const mAll = people.map((p, i) => i).filter(i => people[i].g === 'm');
  const fAll = people.map((p, i) => i).filter(i => people[i].g === 'f');
  let found = null;
  for (let t = 0; t < 5000 && !found; t++){
    const ms = shuffle(mAll), fs = shuffle(fAll);
    let mi = 0, fi = 0;
    const where = {};
    const res = groups.map((g, gi) => {
      const mem = ms.slice(mi, mi + g.m).concat(fs.slice(fi, fi + g.f));
      mi += g.m; fi += g.f;
      mem.forEach(i => { where[i] = gi; });
      return mem;
    });
    if (cons.every(([a, b]) => where[a] !== where[b])) found = res.map(m => shuffle(m));
  }
  if (!found){
    err.textContent = '找不到符合「不能同組」的分法，請放寬限制或調整各組人數。';
    err.classList.add('show');
    return;
  }
  result = found;
  renderResult();
}

function renderResult(){
  const box = $('#results');
  box.textContent = '';
  result.forEach((mem, gi) => {
    const card = document.createElement('div');
    card.className = 'gcard';
    const h = document.createElement('h3');
    const nm = mem.filter(i => people[i].g === 'm').length;
    h.textContent = '第' + (gi + 1) + '組';
    const sm = document.createElement('small');
    sm.textContent = mem.length + ' 人（男 ' + nm + '，女 ' + (mem.length - nm) + '）';
    h.append(sm);
    const ul = document.createElement('ul');
    mem.forEach(i => {
      const li = document.createElement('li');
      li.className = people[i].g;
      li.textContent = nameOf(i);
      ul.append(li);
    });
    card.append(h, ul);
    box.append(card);
  });
  $('#empty').hidden = true;
  $('#again').hidden = false;
  $('#copy').hidden = false;
}

function copyResult(){
  if (!result) return;
  const text = result.map((mem, gi) => '第' + (gi + 1) + '組：' + mem.map(nameOf).join('、')).join('\n');
  const done = () => { const b = $('#copy'); b.textContent = '已複製'; setTimeout(() => b.textContent = '複製結果', 1500); };
  const fallback = () => {
    const t = document.createElement('textarea');
    t.value = text; document.body.append(t); t.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    t.remove();
  };
  try {
    navigator.clipboard.writeText(text).then(done, fallback);
  } catch (e) { fallback(); }
}

const KEY = 'grouping-tool-v1';
function save(){
  try { localStorage.setItem(KEY, JSON.stringify({people, groups, rules, custom})); } catch (e) {}
}
function load(){
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (!d || !Array.isArray(d.people) || !d.people.length || !Array.isArray(d.groups) || !d.groups.length) return false;
    people = d.people.slice(0, 200).map((p, i) => ({name: String(p && p.name != null ? p.name : defName(i)), g: p && p.g === 'f' ? 'f' : 'm'}));
    groups = d.groups.slice(0, 30).map(g => ({size: clampInt(g && g.size, 0, 999), m: clampInt(g && g.m, 0, 999), f: clampInt(g && g.f, 0, 999)}));
    rules = Array.isArray(d.rules) ? d.rules.map(r => ({a: r && Number.isInteger(r.a) ? r.a : null, b: r && Number.isInteger(r.b) ? r.b : null})) : [];
    custom = !!d.custom;
    return true;
  } catch (e) { return false; }
}
function afterGender(){
  if (!custom){ autoFill(); renderGroups(); } else updateStatus();
  save();
}
function removePerson(i){
  if (people.length <= 1) return;
  const n = i + 1;
  people.splice(i, 1);
  rules = rules.filter(r => r.a !== n && r.b !== n)
    .map(r => ({a: r.a > n ? r.a - 1 : r.a, b: r.b > n ? r.b - 1 : r.b}));
  $('#nPeople').value = people.length;
  autoFill(); renderPeople(); renderGroups(); renderRules(); save();
}
function setRange(g){
  const n = people.length, f = $('#rFrom').value, t = $('#rTo').value;
  if (f === '') return;
  let a = clampInt(f, 1, n), b = t === '' ? a : clampInt(t, 1, n);
  if (a > b) [a, b] = [b, a];
  for (let i = a - 1; i < b; i++) people[i].g = g;
  renderPeople(); afterGender();
}
function renderRules(){
  const box = $('#rules');
  box.textContent = '';
  const sp = t => { const s = document.createElement('span'); s.textContent = t; return s; };
  if (!rules.length){
    const p = document.createElement('p');
    p.className = 'empty'; p.style.margin = '0 0 4px';
    p.textContent = '尚未設定。按下方的「＋」，指定哪兩個號碼不能分在同一組。';
    box.append(p);
  }
  rules.forEach((r, i) => {
    const row = document.createElement('div');
    row.className = 'rule';
    const mk = k => {
      const inp = document.createElement('input');
      inp.type = 'number'; inp.min = 1; inp.inputMode = 'numeric';
      inp.value = r[k] == null ? '' : r[k];
      inp.dataset.i = i; inp.dataset.k = k;
      inp.setAttribute('aria-label', '第' + (k === 'a' ? '一' : '二') + '個號碼');
      return inp;
    };
    const del = document.createElement('button');
    del.type = 'button'; del.className = 'del'; del.textContent = '✕';
    del.dataset.rdel = i;
    del.setAttribute('aria-label', '刪除這條限制');
    row.append(sp('第'), mk('a'), sp('號和第'), mk('b'), sp('號不能同組'), del);
    box.append(row);
  });
}

/* events */
$('#nPeople').addEventListener('input', e => {
  if (e.target.value === '') return;
  setPeople(clampInt(e.target.value, 1, 200));
  autoFill(); renderPeople(); renderGroups(); save();
});
$('#nPeople').addEventListener('change', e => { e.target.value = people.length; });

$('#nGroups').addEventListener('input', e => {
  if (e.target.value === '') return;
  setGroups(clampInt(e.target.value, 1, 30));
  autoFill(); renderGroups(); save();
});
$('#nGroups').addEventListener('change', e => { e.target.value = groups.length; });

$('#people').addEventListener('input', e => {
  if (e.target.matches('input[type=text]')){ people[e.target.dataset.i].name = e.target.value; save(); }
});
$('#people').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.del !== undefined){ removePerson(+b.dataset.del); return; }
  people[b.dataset.i].g = b.dataset.g;
  const seg = b.parentElement;
  seg.querySelectorAll('button').forEach(x => {
    const on = x.dataset.g === b.dataset.g;
    x.className = x.dataset.g + (on ? ' on' : '');
    x.setAttribute('aria-pressed', on);
  });
  updatePCount(); afterGender();
});

$('#groups').addEventListener('input', e => {
  const t = e.target;
  if (!t.dataset.k) return;
  const g = groups[+t.dataset.i], k = t.dataset.k;
  const v = clampInt(t.value, 0, 999);
  if (k === 'size'){ g.size = v; g.m = Math.min(g.m, v); g.f = v - g.m; }
  else { g[k] = v; g.size = g.m + g.f; }
  const row = t.closest('.grow');
  ['size', 'm', 'f'].forEach(x => {
    if (x !== k) row.querySelector('[data-k="' + x + '"]').value = g[x];
  });
  custom = true;
  updateStatus(); save();
});

$('#auto').addEventListener('click', () => { autoFill(); renderGroups(); $('#err').classList.remove('show'); save(); });
$('#go').addEventListener('click', generate);
$('#again').addEventListener('click', generate);
$('#copy').addEventListener('click', copyResult);

$('#applyBulk').addEventListener('click', () => {
  const names = $('#bulk').value.split(/[\n,，、;；\t]+/).map(s => s.trim()).filter(Boolean).slice(0, 200);
  if (!names.length) return;
  const old = people;
  people = names.map((n, i) => ({name: n, g: old[i] ? old[i].g : (i % 2 ? 'f' : 'm')}));
  $('#nPeople').value = people.length;
  autoFill(); renderPeople(); renderGroups(); save();
});

$('#rM').addEventListener('click', () => setRange('m'));
$('#rF').addEventListener('click', () => setRange('f'));

$('#rules').addEventListener('input', e => {
  const t = e.target;
  if (!t.dataset.k) return;
  rules[+t.dataset.i][t.dataset.k] = t.value === '' ? null : clampInt(t.value, 1, 999);
  save();
});
$('#rules').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.dataset.rdel === undefined) return;
  rules.splice(+b.dataset.rdel, 1);
  renderRules(); save();
});
$('#addRule').addEventListener('click', () => {
  rules.push({a: null, b: null});
  renderRules(); save();
  const ins = $('#rules').querySelectorAll('input');
  if (ins.length) ins[ins.length - 2].focus();
});

$('#reset').addEventListener('click', e => {
  const b = e.currentTarget;
  if (!b.dataset.armed){
    b.dataset.armed = '1'; b.textContent = '再按一次確認重設';
    setTimeout(() => { delete b.dataset.armed; b.textContent = '重設全部'; }, 3000);
    return;
  }
  delete b.dataset.armed; b.textContent = '重設全部';
  people = []; groups = []; rules = []; result = null;
  setPeople(12); setGroups(3); autoFill();
  $('#nPeople').value = 12; $('#nGroups').value = 3;
  $('#results').textContent = ''; $('#empty').hidden = false;
  $('#again').hidden = true; $('#copy').hidden = true;
  $('#err').classList.remove('show');
  renderPeople(); renderGroups(); renderRules(); save();
});

/* init */
if (load()){
  $('#nPeople').value = people.length;
  $('#nGroups').value = groups.length;
} else {
  setPeople(12); setGroups(3); autoFill();
}
renderPeople(); renderGroups(); renderRules();
</script>
</body>
</html>
